<script>
/* ================= LOCATION LOGIC ================= */

let selectedLocation = null;

function useCurrentLocation() {
  if (!navigator.geolocation) {
    alert("Geolocation not supported by your browser");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (position) => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      selectedLocation = {
        type: "gps",
        latitude: lat,
        longitude: lng
      };

      window.open(
        `https://www.google.com/maps?q=${lat},${lng}`,
        "_blank"
      );

      alert("Location captured successfully. Click Submit to continue.");
    },
    () => {
      alert("Location access denied. Please enter address manually.");
    }
  );
}

function getManualAddress() {
  const state = document.getElementById("state").value;
  const area = document.getElementById("area").value;
  const street = document.getElementById("street").value;
  const pincode = document.getElementById("pincode").value;
  const streetNo = document.getElementById("streetNo").value;

  if (!state && !area && !street && !pincode) {
    return null;
  }

  return {
    type: "manual",
    state,
    area,
    street,
    pincode,
    streetNo
  };
}

/* ================= EXISTING FUNCTION ================= */
function toggleAddressForm() {
  const form = document.getElementById("addressForm");
  form.style.display = form.style.display === "none" ? "block" : "none";
}

async function submitComplaint() {
  const imageInput = document.getElementById("imageInput");
  const image = imageInput.files[0];
  const category = document.getElementById("categorySelect").value;

  if (!image || !category) {
    alert("Please upload image and select category");
    return;
  }

  const formData = new FormData();
  formData.append("image", image);
  formData.append("category", category);

  const manualAddress = getManualAddress();

  if (!selectedLocation && !manualAddress) {
    alert("Please provide either current location or address");
    return;
  }

  if (selectedLocation) {
    formData.append("location_type", "gps");
    formData.append("latitude", selectedLocation.latitude);
    formData.append("longitude", selectedLocation.longitude);
  }

  if (manualAddress) {
    formData.append("location_type", "manual");
    formData.append("address", JSON.stringify(manualAddress));
  }

  try {
    const res = await fetch("http://127.0.0.1:8000/verify", {
      method: "POST",
      body: formData
    });

    const data = await res.json();
    
    alert("AI RESULT:\n" + JSON.stringify(data, null, 2));
  } catch (err) {
    alert("Network or server error");
  }
}
</script>
<script>
/* ================= MAP LOCATION PICKER ================= */

let map, marker;
let selectedLocation = null;

function useCurrentLocation() {
  if (!navigator.geolocation) {
    alert("Geolocation not supported");
    return;
  }

  navigator.geolocation.getCurrentPosition((pos) => {
    openMap(pos.coords.latitude, pos.coords.longitude);
  });
}

function openMap(lat, lng) {
  document.getElementById("mapModal").style.display = "block";

  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat, lng },
    zoom: 16
  });

  marker = new google.maps.Marker({
    position: { lat, lng },
    map: map,
    draggable: true
  });
}

function confirmMapLocation() {
  const pos = marker.getPosition();

  selectedLocation = {
    type: "gps",
    latitude: pos.lat(),
    longitude: pos.lng()
  };

  document.getElementById("mapModal").style.display = "none";
  alert("📍 Location confirmed");
}

/* ================= EXISTING CODE BELOW ================= */

async function submitComplaint() {
  const image = document.getElementById("imageInput").files[0];
  const category = document.getElementById("categorySelect").value;

  if (!image || !category) {
    alert("Please upload image and select category");
    return;
  }

  if (!selectedLocation && !getManualAddress()) {
    alert("Please add location or address");
    return;
  }

  const formData = new FormData();
  formData.append("image", image);
  formData.append("category", category);

  if (selectedLocation) {
    formData.append("location_type", "gps");
    formData.append("latitude", selectedLocation.latitude);
    formData.append("longitude", selectedLocation.longitude);
  }

  const res = await fetch("http://127.0.0.1:8000/verify", {
    method: "POST",
    body: formData
  });

  const data = await res.json();
  alert(JSON.stringify(data, null, 2));
}
</script>

<script>
async function submitComplaint() {
  const imageInput = document.getElementById("imageInput");
  const image = imageInput.files[0];
  const category = document.getElementById("categorySelect").value;
  const description = document.querySelector("textarea").value;

  if (!image) {
    alert("Please upload an image");
    return;
  }

  if (!category) {
    alert("Please select a category");
    return;
  }

  const formData = new FormData();
  formData.append("image", image);
  formData.append("category", category);

  try {
    const res = await fetch("http://127.0.0.1:8000/verify", {
      method: "POST",
      body: formData
    });

    if (!res.ok) {
      throw new Error("Server returned error");
    }

    const data = await res.json();

    alert(
      "AI RESULT ✅\n\n" +
      "Status: " + data.status + "\n" +
      "Verified: " + data.verified + "\n" +
      "Confidence: " + data.confidence + "\n" +
      "Severity: " + data.severity
    );

  } catch (err) {
    console.error(err);
    alert("Network or server error");
  }
}
</script>
