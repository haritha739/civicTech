<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login – CivicAI</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  #languageSelect{
  padding:6px;
  border-radius:6px;
}

}
.card{
  background:#fff;
  padding:30px;
  width:350px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
}
h2{text-align:center;margin-bottom:20px}
input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  width:100%;
  padding:12px;
  background:#2563eb;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
.hidden{display:none}
.note{
  margin-top:15px;
  font-size:12px;
  color:#555;
  text-align:center;
}
</style>
</head>

<body>

<div class="card">
    <div style="text-align:right; margin-bottom:10px;">
  <select id="languageSelect" onchange="changeLanguage(this.value)">
    <option value="en">English</option>
    <option value="hi">हिन्दी</option>
    <option value="te">తెలుగు</option>
  </select>
</div>

  <h2 data-i18n="login_title">Login with Phone</h2>


  <input id="phone" data-i18n-placeholder="phone_placeholder" placeholder="+91XXXXXXXXXX">

  <button onclick="sendOTP()" data-i18n="send_otp">Send OTP</button>


  <div id="otpBox" class="hidden">
    <input id="otp" data-i18n-placeholder="otp_placeholder" placeholder="Enter OTP">

    <button onclick="verifyOTP()" data-i18n="verify_otp">Verify OTP</button>

  </div>

 <div class="note" data-i18n="demo_note">Demo OTP login for hackathon</div>

</div>

<script>
let generatedOTP = null;

function sendOTP(){
  const phone = document.getElementById("phone").value.trim();
  if(!phone){
    alert("Enter phone number");
    return;
  }

  generatedOTP = Math.floor(100000 + Math.random() * 900000);
  alert("🔐 Demo OTP: " + generatedOTP); // SHOW OTP FOR DEMO

  document.getElementById("otpBox").classList.remove("hidden");
}

function verifyOTP(){
  const otp = document.getElementById("otp").value.trim();

  if(otp == generatedOTP){
    localStorage.setItem("loggedIn","true");
    window.location.href = "home.html";
  } else {
    alert("Invalid OTP");
  }
}
</script>
<script>
const translations = {
  en: {
    login_title: "Login with Phone",
    phone_placeholder: "+91XXXXXXXXXX",
    send_otp: "Send OTP",
    otp_placeholder: "Enter OTP",
    verify_otp: "Verify OTP",
    demo_note: "Demo OTP login for hackathon"
  },
  hi: {
    login_title: "फोन से लॉगिन करें",
    phone_placeholder: "+91XXXXXXXXXX",
    send_otp: "OTP भेजें",
    otp_placeholder: "OTP दर्ज करें",
    verify_otp: "OTP सत्यापित करें",
    demo_note: "हैकाथॉन के लिए डेमो OTP लॉगिन"
  },
  te: {
    login_title: "ఫోన్‌తో లాగిన్ చేయండి",
    phone_placeholder: "+91XXXXXXXXXX",
    send_otp: "OTP పంపండి",
    otp_placeholder: "OTP నమోదు చేయండి",
    verify_otp: "OTP నిర్ధారించండి",
    demo_note: "హ్యాకథాన్ కోసం డెమో OTP లాగిన్"
  }
};

function changeLanguage(lang){
  localStorage.setItem("lang", lang);
  applyLanguage(lang);
}

function applyLanguage(lang){
  // Text content
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if(translations[lang][key]){
      el.innerText = translations[lang][key];
    }
  });

  // Placeholders
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    const key = el.getAttribute("data-i18n-placeholder");
    if(translations[lang][key]){
      el.placeholder = translations[lang][key];
    }
  });
}

// Load saved language
const savedLang = localStorage.getItem("lang") || "en";
document.getElementById("languageSelect").value = savedLang;
applyLanguage(savedLang);
</script>
